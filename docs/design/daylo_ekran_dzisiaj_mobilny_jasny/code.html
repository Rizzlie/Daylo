<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daylo — Dzisiaj (Mobile Jasny)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            daylo: {
              accent: '#F05023',
              accentHover: '#D9431A',
              accentBg: '#FFF1EC',
              bgLight: '#FFF8F4',
              surface: '#FFFFFF',
              surfaceSubtle: '#FDFBF9',
              border: '#EFEAE6',
              textMain: '#1F1B18',
              textMuted: '#7A726C',
            }
          },
          boxShadow: {
            card: '0 4px 20px -2px rgba(240, 80, 35, 0.05), 0 2px 8px -1px rgba(0, 0, 0, 0.04)',
            nav: '0 -4px 16px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    .task-done text, .task-done .task-title {
      text-decoration: line-through;
      color: #9CA3AF;
    }
    input[type="checkbox"]:checked {
      background-color: #F05023;
      border-color: #F05023;
    }
  </style>
</head>
<body class="bg-[#FFF8F4] text-[#1F1B18] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-orange-100 selection:text-[#F05023]">

  <!-- Mobile Top Header Bar -->
  <header class="sticky top-0 z-30 bg-[#FFF8F4]/90 backdrop-blur-md px-5 pt-3 pb-2 border-b border-[#EFEAE6]/60 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#FF6A3D] to-[#F04E23] flex items-center justify-center shadow-sm shadow-orange-500/20 text-white font-bold text-base">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" stroke-dasharray="40 15"></circle>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>
      <span class="font-extrabold tracking-tight text-xl text-[#1F1B18]">daylo</span>
    </div>

    <!-- User Avatar & Quick Mode Switch -->
    <div class="flex items-center gap-2">
      <button id="themeToggleBtn" onclick="toggleTheme()" title="Przełącz podgląd ciemny/jasny" class="w-8 h-8 rounded-full border border-[#EFEAE6] bg-white flex items-center justify-center text-xs text-[#7A726C] hover:text-[#F05023] transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
      <div class="w-8 h-8 rounded-full bg-[#FFF1EC] text-[#F05023] font-semibold text-xs flex items-center justify-center border border-[#F05023]/20 shadow-xs">
        MS
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 px-4 pt-4 pb-28 max-w-md mx-auto w-full">
    
    <!-- Greeting Section (Nad główną kartą) -->
    <section class="mb-4 px-1">
      <div class="flex items-baseline justify-between">
        <h1 class="text-2xl font-bold tracking-tight text-[#1F1B18]">Cześć, Maciej!</h1>
        <span class="text-xs font-medium text-[#F05023] bg-[#FFF1EC] px-2.5 py-0.5 rounded-full">Slay queen.</span>
      </div>
      <p class="text-xs font-medium text-[#7A726C] mt-0.5 capitalize">Piątek, 2 października</p>
    </section>

    <!-- Main Card Container -->
    <div class="bg-white rounded-3xl border border-[#EFEAE6] shadow-card p-4 sm:p-5 transition-all duration-200">
      
      <!-- Quick Add Task Form -->
      <section class="mb-5 pb-5 border-b border-[#F4EFEA]">
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <input 
              id="quickInput"
              type="text" 
              placeholder="Co chcesz zrobić?" 
              class="w-full text-sm font-medium bg-[#FFF9F5] border border-[#EFEAE6] rounded-2xl px-4 py-2.5 text-[#1F1B18] placeholder-[#9D958E] focus:outline-none focus:ring-2 focus:ring-[#F05023]/25 focus:border-[#F05023] transition-all"
            />
          </div>
          <button 
            onclick="handleQuickAdd()"
            class="bg-[#F05023] hover:bg-[#D9431A] active:scale-95 text-white font-semibold text-xs px-4 py-2.5 rounded-2xl transition-all shadow-sm shadow-orange-500/30 flex items-center gap-1.5"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Dodaj
          </button>
        </div>

        <!-- Więcej opcji toggle button -->
        <div class="mt-2.5 flex items-center justify-between">
          <button 
            type="button" 
            onclick="toggleMoreOptions()" 
            class="text-[11px] font-semibold text-[#F05023] hover:underline flex items-center gap-1 py-1 px-1"
          >
            <span id="moreOptText">Więcej opcji</span>
            <svg id="moreOptIcon" class="w-3 h-3 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <span class="text-[10px] text-[#9D958E]">Domyślnie dzisiaj • Osobiste</span>
        </div>

        <!-- Rozszerzony formularz (Expanded options) -->
        <div id="expandedOptions" class="hidden mt-3 p-3.5 bg-[#FFF9F5] rounded-2xl border border-[#EFEAE6] space-y-3">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[10px] font-bold text-[#7A726C] uppercase tracking-wider mb-1">Data</label>
              <input type="date" value="2025-10-02" class="w-full text-xs bg-white border border-[#EFEAE6] rounded-xl px-2.5 py-1.5 text-[#1F1B18] focus:border-[#F05023] focus:outline-none">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-[#7A726C] uppercase tracking-wider mb-1">Godzina (opcjonalnie)</label>
              <input type="time" placeholder="--:--" class="w-full text-xs bg-white border border-[#EFEAE6] rounded-xl px-2.5 py-1.5 text-[#1F1B18] focus:border-[#F05023] focus:outline-none">
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-[#7A726C] uppercase tracking-wider mb-1">Opis zadania</label>
            <textarea rows="2" placeholder="Dodaj krótki kontekst lub notatkę..." class="w-full text-xs bg-white border border-[#EFEAE6] rounded-xl p-2 text-[#1F1B18] placeholder-[#9D958E] focus:border-[#F05023] focus:outline-none resize-none"></textarea>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-[#7A726C] uppercase tracking-wider mb-1">Przypisanie</label>
            <div class="flex gap-2">
              <label class="flex-1 flex items-center justify-center gap-1.5 p-1.5 rounded-xl border border-[#F05023] bg-white cursor-pointer text-xs font-semibold text-[#F05023]">
                <input type="radio" name="scope" checked class="hidden">
                <span>👤 Osobiste</span>
              </label>
              <label class="flex-1 flex items-center justify-center gap-1.5 p-1.5 rounded-xl border border-[#EFEAE6] bg-white cursor-pointer text-xs font-medium text-[#7A726C] hover:border-gray-300">
                <input type="radio" name="scope" class="hidden">
                <span>🏠 Dom</span>
              </label>
              <label class="flex-1 flex items-center justify-center gap-1.5 p-1.5 rounded-xl border border-[#EFEAE6] bg-white cursor-pointer text-xs font-medium text-[#7A726C] hover:border-gray-300">
                <input type="radio" name="scope" class="hidden">
                <span>👥 Praca</span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- 1. Plan dnia (Chronologiczna oś czasu dla zadań z godziną) -->
      <section class="mb-6">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#F05023]"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#7A726C]">Plan dnia</h2>
          </div>
          <span class="text-[11px] font-semibold text-[#7A726C] bg-[#F4EFEA] px-2 py-0.5 rounded-full">3 zadania</span>
        </div>

        <div class="relative pl-3 space-y-3.5 before:absolute before:left-[19px] before:top-3 before:bottom-3 before:w-[1.5px] before:bg-[#EFEAE6]">
          
          <!-- Zadanie 1: 10:00 -->
          <div class="relative flex items-start gap-3 group">
            <div class="w-3.5 h-3.5 rounded-full bg-white border-2 border-[#F05023] z-10 mt-1 flex-shrink-0"></div>
            <div class="flex-1 bg-[#FFFDFC] border border-[#F2ECE7] rounded-2xl p-2.5 flex items-center justify-between gap-2 shadow-2xs hover:border-[#E8DFD8] transition-all">
              <label class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer">
                <input type="checkbox" onchange="toggleTaskDone(this)" class="w-4 h-4 rounded-md text-[#F05023] border-[#D7CFC8] focus:ring-[#F05023]/30 flex-shrink-0 transition">
                <span class="text-xs font-bold text-[#F05023] whitespace-nowrap">10:00</span>
                <span class="text-xs font-medium text-[#1F1B18] truncate task-title">Spisać licznik</span>
              </label>
              <span class="inline-flex items-center gap-1 text-[10px] font-semibold text-[#705646] bg-[#F4EAE1] px-2 py-0.5 rounded-full flex-shrink-0" title="Zadanie współdzielone">
                <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Dom
              </span>
            </div>
          </div>

          <!-- Zadanie 2: 18:00 -->
          <div class="relative flex items-start gap-3 group">
            <div class="w-3.5 h-3.5 rounded-full bg-white border-2 border-[#F05023] z-10 mt-1 flex-shrink-0"></div>
            <div class="flex-1 bg-[#FFFDFC] border border-[#F2ECE7] rounded-2xl p-2.5 flex items-center justify-between gap-2 shadow-2xs hover:border-[#E8DFD8] transition-all">
              <label class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer">
                <input type="checkbox" onchange="toggleTaskDone(this)" class="w-4 h-4 rounded-md text-[#F05023] border-[#D7CFC8] focus:ring-[#F05023]/30 flex-shrink-0 transition">
                <span class="text-xs font-bold text-[#F05023] whitespace-nowrap">18:00</span>
                <span class="text-xs font-medium text-[#1F1B18] truncate task-title">Trening siłowy</span>
              </label>
              <span class="inline-flex items-center gap-1 text-[10px] font-medium text-[#7A726C] bg-[#F3ECE6] px-2 py-0.5 rounded-full flex-shrink-0">
                <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                Osobiste
              </span>
            </div>
          </div>

          <!-- Zadanie 3: 21:00 -->
          <div class="relative flex items-start gap-3 group">
            <div class="w-3.5 h-3.5 rounded-full bg-white border-2 border-[#F05023] z-10 mt-1 flex-shrink-0"></div>
            <div class="flex-1 bg-[#FFFDFC] border border-[#F2ECE7] rounded-2xl p-2.5 flex items-center justify-between gap-2 shadow-2xs hover:border-[#E8DFD8] transition-all">
              <label class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer">
                <input type="checkbox" onchange="toggleTaskDone(this)" class="w-4 h-4 rounded-md text-[#F05023] border-[#D7CFC8] focus:ring-[#F05023]/30 flex-shrink-0 transition">
                <span class="text-xs font-bold text-[#F05023] whitespace-nowrap">21:00</span>
                <span class="text-xs font-medium text-[#1F1B18] truncate task-title">Poczytać książkę</span>
              </label>
              <span class="inline-flex items-center gap-1 text-[10px] font-medium text-[#7A726C] bg-[#F3ECE6] px-2 py-0.5 rounded-full flex-shrink-0">
                <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                Osobiste
              </span>
            </div>
          </div>

        </div>
      </section>

      <!-- 2. Do zrobienia (Zadania bez określonej godziny) -->
      <section class="mb-6">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#8F8781]"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#7A726C]">Do zrobienia</h2>
          </div>
          <span class="text-[11px] font-semibold text-[#7A726C] bg-[#F4EFEA] px-2 py-0.5 rounded-full">2</span>
        </div>

        <div class="space-y-2">
          <!-- Zadanie A -->
          <div class="bg-[#FFFDFC] border border-[#F2ECE7] rounded-2xl p-2.5 flex items-center justify-between gap-2 hover:border-[#E8DFD8] transition-all">
            <label class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer">
              <input type="checkbox" onchange="toggleTaskDone(this)" class="w-4 h-4 rounded-md text-[#F05023] border-[#D7CFC8] focus:ring-[#F05023]/30 flex-shrink-0">
              <span class="text-xs font-medium text-[#1F1B18] break-words task-title">Spakować rzeczy na jutro</span>
            </label>
            <span class="inline-flex items-center gap-1 text-[10px] font-medium text-[#7A726C] bg-[#F3ECE6] px-2 py-0.5 rounded-full flex-shrink-0">
              <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              Osobiste
            </span>
          </div>

          <!-- Zadanie B -->
          <div class="bg-[#FFFDFC] border border-[#F2ECE7] rounded-2xl p-2.5 flex items-center justify-between gap-2 hover:border-[#E8DFD8] transition-all">
            <label class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer">
              <input type="checkbox" onchange="toggleTaskDone(this)" class="w-4 h-4 rounded-md text-[#F05023] border-[#D7CFC8] focus:ring-[#F05023]/30 flex-shrink-0">
              <span class="text-xs font-medium text-[#1F1B18] break-words task-title">Umówić serwis roweru</span>
            </label>
            <span class="inline-flex items-center gap-1 text-[10px] font-medium text-[#7A726C] bg-[#F3ECE6] px-2 py-0.5 rounded-full flex-shrink-0">
              <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              Osobiste
            </span>
          </div>
        </div>
      </section>

      <!-- 3. Zaległe (Niewykonane z poprzednich dni) -->
      <section class="mb-6">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-rose-500"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-rose-700">Zaległe</h2>
          </div>
          <span class="text-[11px] font-semibold text-rose-700 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-100">1</span>
        </div>

        <div class="space-y-2">
          <div class="bg-[#FFF8F7] border border-rose-200/70 rounded-2xl p-2.5 flex items-center justify-between gap-2 hover:border-rose-300 transition-all">
            <div class="flex items-center gap-2.5 flex-1 min-w-0">
              <input type="checkbox" onchange="toggleTaskDone(this)" class="w-4 h-4 rounded-md text-[#F05023] border-rose-300 focus:ring-rose-400 flex-shrink-0">
              <div class="min-w-0">
                <p class="text-xs font-medium text-[#1F1B18] task-title">Przejrzeć dokumenty</p>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="inline-flex items-center gap-1 text-[10px] font-bold text-rose-600">
                    <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Termin: 30 września
                  </span>
                </div>
              </div>
            </div>
            <span class="inline-flex items-center gap-1 text-[10px] font-semibold text-[#705646] bg-[#F4EAE1] px-2 py-0.5 rounded-full flex-shrink-0">
              <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              Dom
            </span>
          </div>
        </div>
      </section>

      <!-- 4. Ukończone (Sekcja domyślnie zwinięta) -->
      <section class="border-t border-[#F4EFEA] pt-4">
        <button 
          onclick="toggleCompletedSection()" 
          class="w-full flex items-center justify-between text-left py-1 group"
        >
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span class="text-xs font-bold uppercase tracking-wider text-[#7A726C] group-hover:text-[#1F1B18] transition-colors">Ukończone</span>
            <span id="completedCounter" class="text-[11px] font-semibold text-[#7A726C] bg-[#F4EFEA] px-2 py-0.5 rounded-full">2</span>
          </div>
          <div class="flex items-center gap-1 text-[11px] font-medium text-[#7A726C]">
            <span id="completedToggleLabel">Pokaż</span>
            <svg id="completedChevron" class="w-3.5 h-3.5 transform transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </button>

        <div id="completedTasksList" class="hidden mt-3 space-y-2 opacity-75">
          <!-- Zadanie U1 -->
          <div class="task-done bg-[#FAF7F5] border border-[#EFEAE6] rounded-2xl p-2.5 flex items-center justify-between gap-2">
            <label class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer">
              <input type="checkbox" checked onchange="toggleTaskDone(this)" class="w-4 h-4 rounded-md text-[#F05023] border-[#D7CFC8] focus:ring-[#F05023]/30">
              <span class="text-xs font-medium text-gray-400 line-through truncate task-title">Odpisać na wiadomość</span>
            </label>
            <span class="inline-flex items-center gap-1 text-[10px] font-medium text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full flex-shrink-0">
              Osobiste
            </span>
          </div>

          <!-- Zadanie U2 -->
          <div class="task-done bg-[#FAF7F5] border border-[#EFEAE6] rounded-2xl p-2.5 flex items-center justify-between gap-2">
            <label class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer">
              <input type="checkbox" checked onchange="toggleTaskDone(this)" class="w-4 h-4 rounded-md text-[#F05023] border-[#D7CFC8] focus:ring-[#F05023]/30">
              <span class="text-xs font-medium text-gray-400 line-through truncate task-title">Podlać kwiaty</span>
            </label>
            <span class="inline-flex items-center gap-1 text-[10px] font-medium text-[#705646] bg-[#F4EAE1] px-2 py-0.5 rounded-full flex-shrink-0">
              Dom
            </span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Mobilne menu na dole (Dzisiaj, Grupy, Ustawienia z safe area) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-[#EFEAE6] shadow-nav pb-safe">
    <div class="max-w-md mx-auto px-6 py-2 flex items-center justify-between">
      
      <!-- Dzisiaj (Aktywna) -->
      <button class="flex flex-col items-center gap-1 text-[#F05023] relative py-1 px-3">
        <div class="w-6 h-6 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3">
            <rect x="3" y="4" width="18" height="18" rx="3" stroke="currentColor"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
            <circle cx="12" cy="15" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        <span class="text-[11px] font-bold tracking-tight">Dzisiaj</span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#F05023] absolute -bottom-1"></span>
      </button>

      <!-- Grupy -->
      <button class="flex flex-col items-center gap-1 text-[#7A726C] hover:text-[#1F1B18] py-1 px-3 transition-colors">
        <div class="w-6 h-6 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">

  <!-- Interactive script for demo actions -->
  <script>
    function toggleMoreOptions() {
      const box = document.getElementById('expandedOptions');
      const icon = document.getElementById('moreOptIcon');
      const text = document.getElementById('moreOptText');
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        icon.classList.add('rotate-180');
        text.innerText = 'Mniej opcji';
      } else {
        box.classList.add('hidden');
        icon.classList.remove('rotate-180');
        text.innerText = 'Więcej opcji';
      }
    }

    function toggleCompletedSection() {
      const list = document.getElementById('completedTasksList');
      const chevron = document.getElementById('completedChevron');
      const label = document.getElementById('completedToggleLabel');
      if (list.classList.contains('hidden')) {
        list.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        label.innerText = 'Zwiń';
      } else {
        list.classList.add('hidden');
        chevron.classList.remove('rotate-180');
        label.innerText = 'Pokaż';
      }
    }

    function toggleTaskDone(checkbox) {
      const parent = checkbox.closest('div');
      const title = parent.querySelector('.task-title');
      if (checkbox.checked) {
        if (title) {
          title.classList.add('line-through', 'text-gray-400');
        }
      } else {
        if (title) {
          title.classList.remove('line-through', 'text-gray-400');
        }
      }
    }

    function handleQuickAdd() {
      const input = document.getElementById('quickInput');
      const val = input.value.trim();
      if (!val) {
        input.focus();
        return;
      }
      alert('Dodano nowe zadanie do "Do zrobienia": ' + val);
      input.value = '';
    }

    function toggleTheme() {
      // Prosty przełącznik demonstracyjny
      document.body.classList.toggle('dark');
      if (document.body.classList.contains('dark')) {
        document.body.style.backgroundColor = '#18181B';
        document.body.style.color = '#F4F4F5';
      } else {
        document.body.style.backgroundColor = '#FFF8F4';
        document.body.style.color = '#1F1B18';
      }
    }
  </script>
</body>
</html>
