<h2 mat-dialog-title>Usunąć zadanie?</h2>
<mat-dialog-content [attr.aria-busy]="busy()">
  <p class="title">{{ task.title }}</p>
  <p>Tej operacji nie można cofnąć.</p>
  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  @if (conflict()) {
    <button mat-button [mat-dialog-close]="true">Wróć i odśwież listę</button>
  } @else {
    <button mat-button mat-dialog-close [disabled]="busy()" cdkFocusInitial>Anuluj</button>
    <button mat-flat-button (click)="remove()" [disabled]="busy()">
      {{ busy() ? 'Usuwanie…' : 'Usuń' }}
    </button>
  }
</mat-dialog-actions>
