name: Foundation CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'
  NX_DAEMON: 'false'
  NX_BASE: ${{ github.event.pull_request.base.sha }}
  NX_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  conventions:
    name: Commit and PR conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          test -n "$PR_TITLE"
          printf '%s\n' "$PR_TITLE" | npm exec --no -- commitlint --config commitlint.pr.config.cjs --strict --verbose
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          merge_base=$(git merge-base "$NX_BASE" "$NX_HEAD")
          npm exec --no -- commitlint --from "$merge_base" --to "$NX_HEAD" --strict --verbose
      - name: Validate latest main commit
        if: github.event_name == 'push'
        run: npm exec --no -- commitlint --last --strict --verbose

  quality:
    name: Lint, unit tests and production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run affected PR checks
        if: github.event_name == 'pull_request'
        run: npm exec nx -- affected -t lint test build --base="$NX_BASE" --head="$NX_HEAD"
      - name: Run full main checks
        if: github.event_name == 'push'
        run: npm exec nx -- run-many -t lint test build

  e2e:
    name: Affected shell E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Select E2E projects
        id: selection
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            npm exec nx -- show projects --affected --withTarget=e2e --base="$NX_BASE" --head="$NX_HEAD" --json > "$RUNNER_TEMP/affected-e2e.json"
          else
            npm exec nx -- show projects --withTarget=e2e --json > "$RUNNER_TEMP/affected-e2e.json"
          fi
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const projects = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "affected-e2e.json"), "utf8")); console.log(`run=${projects.length > 0}`);' >> "$GITHUB_OUTPUT"
      - name: Install Chromium and OS dependencies
        if: steps.selection.outputs.run == 'true'
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Run affected PR E2E
        if: steps.selection.outputs.run == 'true' && github.event_name == 'pull_request'
        run: npm exec nx -- affected -t e2e --base="$NX_BASE" --head="$NX_HEAD"
      - name: Run full main E2E
        if: steps.selection.outputs.run == 'true' && github.event_name == 'push'
        run: npm exec nx -- run-many -t e2e
      - name: Upload Playwright reports and failure artifacts
        if: ${{ !cancelled() && steps.selection.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            dist/.playwright/apps/web-e2e/playwright-report
            dist/.playwright/apps/web-e2e/test-output
          if-no-files-found: ignore
          retention-days: 7
